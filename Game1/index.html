<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>清明開車挑戰</title>
    <style>
        /* --- 奶油可愛風 CSS --- */
        body {
            background: #e8f5e9; font-family: "微軟正黑體", sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        #game-container {
            background: white; padding: 40px; border-radius: 45px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center; width: 620px; border: 10px solid white;
        }

        h1 { color: #6ab04c; font-size: 32px; margin-bottom: 10px; }
        #story-text { background: #f1f8e9; padding: 15px; border-radius: 20px; color: #2e7d32; font-weight: bold; margin-bottom: 15px; }
        
        canvas { 
            border-radius: 30px; background: #fff; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05); 
            border: 5px solid #eee;
        }

        /* 像果凍一樣的按鈕 */
        button {
            padding: 15px 50px; font-size: 22px; font-weight: bold;
            background: linear-gradient(to bottom, #badc58, #6ab04c);
            color: white; border: none; border-radius: 40px;
            cursor: pointer; box-shadow: 0 8px 0 #2e7d32; transition: 0.1s; margin-top: 10px;
        }
        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #2e7d32; }

        #score-board { 
            margin-top: 15px; font-size: 24px; background: #ff7979; 
            color: white; padding: 10px 45px; border-radius: 50px; 
            display: inline-block; font-weight: bold; 
        }

        #leaderboard { list-style: none; padding: 0; margin-top: 15px; text-align: left; }
        #leaderboard li { background: #fafafa; margin: 8px 0; padding: 12px 20px; border-radius: 15px; display: flex; justify-content: space-between; border: 1px solid #eee; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <h1>開車挑戰 🚗</h1>
        <p style="color:#666; font-size: 18px;">準備好幫父母完成掃墓任務了嗎？<br>集滿 10 個元寶就過關！</p>
        <button onclick="startGame()">立刻出發！</button>
    </div>

    <div id="game-stage" style="display:none;">
        <div id="story-text">🚗 左右移動：避開障礙物，收集 10 個元寶！</div>
        <canvas id="gameCanvas" width="560" height="400"></canvas>
        <br>
        <div id="score-board">🪙 元寶: <span id="coin-count">0</span> / 10</div>
    </div>

    <div id="end-screen" style="display:none;">
        <h2 style="color:#6ab04c; font-size: 32px;">🎉 抵達目的地！</h2>
        <p style="font-size: 20px; font-weight: bold; color: #444;">大山，妳成功收集了 10 個元寶並抵達墓園！</p>
        <h3 style="color:#ffa000;">🏆 抵達紀錄</h3>
        <ul id="leaderboard"></ul>
        <button onclick="location.reload()">再玩一次</button>
    </div>
</div>

<script>
    // --- 🔊 魔法音效引擎 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(f, t, d) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.value = f; g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
    }
    const sound = {
        ok: () => playSfx(880, 'sine', 0.2),
        no: () => playSfx(150, 'sawtooth', 0.4),
        win: () => { playSfx(523, 'sine', 0.1); setTimeout(()=>playSfx(783, 'sine', 0.3), 100); }
    };

    // --- 🎮 遊戲變數 ---
    let userName = "大山", coinsCollected = 0, isGameOver = false; // 這裡預設為大山
    const canvas = document.getElementById("gameCanvas"), ctx = canvas.getContext("2d");
    let keys = { ArrowLeft: false, ArrowRight: false };
    let carX = 280, obstacles = [], coinItems = [];

    window.addEventListener("keydown", e => keys[e.key] = true);
    window.addEventListener("keyup", e => keys[e.key] = false);

    function startGame() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById("start-screen").style.display = "none";
        document.getElementById("game-stage").style.display = "block";
        gameLoop();
    }

    function drawEmoji(emoji, x, y, size) {
        ctx.font = `${size}px serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(emoji, x, y);
    }

    function gameLoop() {
        if(isGameOver) return;

        // 1. 畫背景 (簡易馬路)
        ctx.fillStyle = "#e8f5e9"; ctx.fillRect(0,0,560,400);
        ctx.strokeStyle = "white"; ctx.setLineDash([20, 20]);
        ctx.beginPath(); ctx.moveTo(280, 0); ctx.lineTo(280, 400); ctx.stroke();

        // 2. 移動玩家
        if(keys.ArrowLeft && carX > 50) carX -= 7;
        if(keys.ArrowRight && carX < 510) carX += 7;
        drawEmoji("🚗", carX, 340, 50);

        // 3. 生成障礙物 🚧
        if(Math.random() < 0.02) obstacles.push({x: 50 + Math.random()*460, y: -50});
        obstacles.forEach((o, i) => {
            o.y += 4;
            drawEmoji("🚧", o.x, o.y, 40);
            if(Math.abs(carX - o.x) < 40 && Math.abs(340 - o.y) < 40) {
                sound.no();
                obstacles.splice(i, 1);
                coinsCollected = Math.max(0, coinsCollected - 1);
                document.getElementById("coin-count").innerText = coinsCollected;
            } else if(o.y > 450) obstacles.splice(i, 1);
        });

        // 4. 生成元寶 🪙
        if(Math.random() < 0.015) coinItems.push({x: 50 + Math.random()*460, y: -50});
        coinItems.forEach((c, i) => {
            c.y += 3;
            drawEmoji("🪙", c.x, c.y, 35);
            if(Math.abs(carX - c.x) < 40 && Math.abs(340 - c.y) < 40) {
                sound.ok();
                coinItems.splice(i, 1);
                coinsCollected++;
                document.getElementById("coin-count").innerText = coinsCollected;
                if(coinsCollected >= 10) endGame();
            } else if(c.y > 450) coinItems.splice(i, 1);
        });

        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        isGameOver = true;
        sound.win();
        document.getElementById("game-stage").style.display = "none";
        document.getElementById("end-screen").style.display = "block";
        saveScore();
    }

    function saveScore() {
        let history = JSON.parse(localStorage.getItem("q_car_fast")) || [];
        history.push({ d: new Date().toLocaleTimeString() });
        localStorage.setItem("q_car_fast", JSON.stringify(history.slice(-5)));
        let list = "";
        history.slice(-5).reverse().forEach((e, i) => {
            list += `<li><span>第 ${history.length - i} 次挑戰</span><span>✅ 抵達成功 (${e.d})</span></li>`;
        });
        document.getElementById("leaderboard").innerHTML = list;
    }
</script>

</body>
</html>
